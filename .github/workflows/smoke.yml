name: Smoke Tests

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone vivid-core
        run: |
          rm -rf ${{ github.workspace }}/../vivid
          git clone --recurse-submodules https://github.com/seethroughlab/vivid.git ${{ github.workspace }}/../vivid

      - name: Reset vivid-core build dir
        run: rm -rf ${{ github.workspace }}/../vivid/build

      - name: Configure vivid-core
        run: cmake -B ${{ github.workspace }}/../vivid/build -S ${{ github.workspace }}/../vivid -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Create app bundle skeleton
        run: mkdir -p ${{ github.workspace }}/../vivid/build/vivid.app/Contents/PlugIns

      - name: Build test_demo_graphs and vivid core operators
        run: cmake --build ${{ github.workspace }}/../vivid/build --target test_demo_graphs operators -j$(sysctl -n hw.logicalcpu)

      - name: Stage wgpu_native dylib for package build
        # vivid-core's FetchContent may download both arm64 and x86_64 wgpu
        # releases side-by-side under _deps/. vivid-3d's CMake prefers the
        # libwgpu_native.dylib inside the vivid app bundle, so we explicitly
        # copy the host-arch dylib there to avoid its fallback glob picking
        # the wrong arch (silent linker failure: "required architecture arm64,
        # found x86_64").
        run: |
          host_arch=$(uname -m)
          case "$host_arch" in
            arm64)  wgpu_arch_tag=aarch64 ;;
            x86_64) wgpu_arch_tag=x86_64 ;;
            *)
              echo "Unsupported host arch: $host_arch" >&2
              exit 1
              ;;
          esac

          deps_dir="${{ github.workspace }}/../vivid/build/_deps"
          wgpu_dir=$(find "$deps_dir" -maxdepth 1 -type d -name "wgpu-macos-${wgpu_arch_tag}-*-src" | head -n 1)
          if [ -z "$wgpu_dir" ] || [ ! -f "$wgpu_dir/lib/libwgpu_native.dylib" ]; then
            echo "Failed to locate libwgpu_native.dylib for arch=$wgpu_arch_tag in $deps_dir" >&2
            find "$deps_dir" -maxdepth 2 -type d >&2 || true
            exit 1
          fi

          wgpu_lib="$wgpu_dir/lib/libwgpu_native.dylib"
          echo "Using libwgpu_native: $wgpu_lib"

          # Stage the dylib where vivid-3d's CMakeLists.txt checks first.
          macos_dir="${{ github.workspace }}/../vivid/build/vivid.app/Contents/MacOS"
          mkdir -p "$macos_dir"
          cp "$wgpu_lib" "$macos_dir/libwgpu_native.dylib"

          echo "VIVID_OSX_ARCH=$host_arch" >> $GITHUB_ENV

      - name: Configure package
        # VIVID_PACKAGE_BUILD_TESTS is intentionally off: the package's
        # tests/ C++ units include vivid-core runtime headers at their old
        # pre-restructure paths (runtime/operator_registry.h, runtime/graph.h,
        # runtime/scheduler.h) and haven't been updated. The meaningful smoke
        # coverage comes from running test_demo_graphs against this package's
        # graphs/, below.
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_OSX_ARCHITECTURES=${{ env.VIVID_OSX_ARCH }} -DVIVID_SRC_DIR=${{ github.workspace }}/../vivid -DVIVID_BUILD_DIR=${{ github.workspace }}/../vivid/build -DVIVID_PACKAGE_BUILD_TESTS=OFF

      - name: Build operator dylibs
        run: cmake --build build --target operators -j$(sysctl -n hw.logicalcpu)

      - name: Copy operators to vivid build dir
        run: cp build/*.dylib ${{ github.workspace }}/../vivid/build/

      - name: Run smoke tests
        run: cd ${{ github.workspace }}/../vivid/build && ./test_demo_graphs ${{ github.workspace }}/graphs
